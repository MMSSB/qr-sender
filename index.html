<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LightStream: Pro Edition</title>
    <!-- Dependencies -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <style>
        /* Modern, Framework-Free Styling */
        :root {
            --bg: #0f172a;
            --surface: #1e293b;
            --primary: #38bdf8;
            --primary-hover: #0ea5e9;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --success: #22c55e;
            --radius: 16px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Top Navigation */
        header {
            text-align: center;
            padding: 2rem 1rem 1rem;
        }
        
        h1 { font-size: 2rem; font-weight: 800; letter-spacing: -1px; margin-bottom: 0.5rem; }
        h1 span { color: var(--primary); }
        
        .tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 20px auto;
            background: rgba(255,255,255,0.05);
            padding: 5px;
            border-radius: 30px;
            width: fit-content;
        }

        .tab-btn {
            background: transparent;
            color: var(--text-muted);
            border: none;
            padding: 10px 24px;
            border-radius: 24px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
        }

        /* Page Layout */
        .page {
            display: none;
            flex: 1;
            flex-direction: column;
            align-items: center;
            padding: 1rem;
            animation: fadeIn 0.4s ease;
        }
        
        .page.active { display: flex; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card {
            background: var(--surface);
            padding: 2rem;
            border-radius: var(--radius);
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Controls */
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        
        label { font-size: 0.85rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; }
        
        input[type="range"] { accent-color: var(--primary); }

        .btn {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            text-align: center;
        }
        
        .btn:hover { background: var(--primary-hover); }
        .btn:disabled { background: #334155; color: #64748b; cursor: not-allowed; }

        /* Media Displays */
        .qr-display {
            width: 100%;
            aspect-ratio: 1;
            background: #fff;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        #qr-image { width: 100%; height: 100%; object-fit: contain; }
        
        video { width: 100%; border-radius: 12px; background: #000; object-fit: cover; }
        canvas { display: none; } /* Hidden canvas for scanning processing */

        .status-bar {
            background: rgba(0,0,0,0.2);
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-family: monospace;
            font-size: 0.9rem;
        }

        .progress-container { width: 100%; background: #334155; border-radius: 8px; height: 8px; overflow: hidden; margin-top: 10px; }
        .progress-bar { height: 100%; background: var(--success); width: 0%; transition: width 0.1s linear; }

        /* File Input Styling */
        input[type="file"] {
            display: block;
            width: 100%;
            padding: 10px;
            border: 2px dashed var(--primary);
            border-radius: 8px;
            background: rgba(56, 189, 248, 0.05);
            color: var(--text);
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <h1>Light<span>Stream</span></h1>
        
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('sender')">Send File</button>
            <button class="tab-btn" onclick="switchTab('receiver')">Receive File</button>
        </div>
    </header>

    <!-- SENDER PAGE -->
    <main id="sender" class="page active">
        <div class="card">
            <input type="file" id="fileInput">
            
            <div class="control-group">
                <label>Transfer Speed (<span id="fpsVal">15</span> FPS)</label>
                <input type="range" id="fpsSlider" min="5" max="30" value="15">
            </div>

            <div class="control-group">
                <label>QR Density (<span id="densityVal">150</span> chars)</label>
                <input type="range" id="densitySlider" min="50" max="300" value="150" step="10">
                <small style="color: var(--text-muted); font-size: 0.75rem;">Higher density is faster but requires a better camera.</small>
            </div>

            <button id="prepareBtn" class="btn" disabled>Prepare Broadcast</button>

            <div class="qr-display">
                <img id="qr-image" style="display: none;" alt="QR Code Stream">
                <div id="sender-status" style="color: black;">Awaiting File...</div>
            </div>
            
            <div class="status-bar" id="broadcast-stats">Ready</div>
        </div>
    </main>

    <!-- RECEIVER PAGE -->
    <main id="receiver" class="page">
        <div class="card">
            <button id="startRecvBtn" class="btn">Start Camera</button>
            
            <video id="camera-feed" autoplay playsinline></video>
            <canvas id="scanCanvas"></canvas>
            
            <div class="status-bar" id="receiver-status">Camera Off</div>
            
            <div class="progress-container">
                <div class="progress-bar" id="recv-progress"></div>
            </div>
            <div id="recv-stats" style="text-align: center; margin-top: 5px; font-family: monospace;">0 / 0 Chunks</div>
        </div>
    </main>

    <script>
        // --- UI LOGIC ---
        function switchTab(tabId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');
        }

        document.getElementById('fpsSlider').addEventListener('input', (e) => {
            document.getElementById('fpsVal').innerText = e.target.value;
            if(broadcastInterval) updateBroadcastSpeed(e.target.value);
        });

        document.getElementById('densitySlider').addEventListener('input', (e) => {
            document.getElementById('densityVal').innerText = e.target.value;
        });


        // --- SENDER LOGIC (PRE-RENDER & SHUFFLE) ---
        let preRenderedQRs = [];
        let broadcastIndices = [];
        let broadcastInterval;
        let currentLoopIndex = 0;
        let selectedFileBase64 = "";
        let selectedFileName = "";

        const fileInput = document.getElementById('fileInput');
        const prepareBtn = document.getElementById('prepareBtn');
        const qrImage = document.getElementById('qr-image');
        const senderStatus = document.getElementById('sender-status');
        const broadcastStats = document.getElementById('broadcast-stats');
        
        // Setup hidden QRious instance for pre-rendering
        const qrGenerator = new QRious({ size: 400, level: 'L' }); // Level L allows more data

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            prepareBtn.disabled = true;
            senderStatus.innerText = "Reading file...";
            
            const reader = new FileReader();
            reader.onload = (event) => {
                selectedFileBase64 = event.target.result;
                selectedFileName = file.name;
                prepareBtn.disabled = false;
                senderStatus.innerText = "File loaded. Ready to prepare.";
            };
            reader.readAsDataURL(file);
        });

        prepareBtn.addEventListener('click', async () => {
            if (!selectedFileBase64) return;
            
            prepareBtn.disabled = true;
            fileInput.disabled = true;
            qrImage.style.display = "none";
            senderStatus.style.display = "block";
            
            const chunkSize = parseInt(document.getElementById('densitySlider').value);
            const totalChunks = Math.ceil(selectedFileBase64.length / chunkSize);
            
            preRenderedQRs = [];
            
            // Allow UI to update before heavy processing
            for (let i = 0; i < totalChunks; i++) {
                senderStatus.innerText = `Rendering QR ${i+1}/${totalChunks}...`;
                await new Promise(r => setTimeout(r, 0)); // Yield to main thread
                
                const chunkData = selectedFileBase64.slice(i * chunkSize, (i + 1) * chunkSize);
                const payload = `${selectedFileName}|${i}|${totalChunks}|${chunkData}`;
                
                qrGenerator.value = payload;
                preRenderedQRs.push(qrGenerator.toDataURL());
            }

            senderStatus.style.display = "none";
            qrImage.style.display = "block";
            
            startBroadcast();
        });

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function startBroadcast() {
            // Create an array of indices to represent our chunks
            broadcastIndices = Array.from({length: preRenderedQRs.length}, (_, i) => i);
            currentLoopIndex = 0;
            
            updateBroadcastSpeed(document.getElementById('fpsSlider').value);
        }

        function updateBroadcastSpeed(fps) {
            clearInterval(broadcastInterval);
            const intervalMs = 1000 / fps;
            
            broadcastInterval = setInterval(() => {
                if (currentLoopIndex >= broadcastIndices.length) {
                    // THE MAGIC FIX: Shuffle order on every new loop to prevent missing the same frame
                    shuffleArray(broadcastIndices);
                    currentLoopIndex = 0;
                }
                
                const actualChunkIndex = broadcastIndices[currentLoopIndex];
                qrImage.src = preRenderedQRs[actualChunkIndex];
                
                broadcastStats.innerText = `Broadcasting: ${preRenderedQRs.length} Chunks | Loop Frame: ${currentLoopIndex}`;
                currentLoopIndex++;
                
            }, intervalMs);
        }


        // --- RECEIVER LOGIC (OPTIMIZED SCANNING) ---
        const video = document.getElementById('camera-feed');
        const scanCanvas = document.getElementById('scanCanvas');
        const ctx = scanCanvas.getContext('2d', { willReadFrequently: true });
        const recvStatus = document.getElementById('receiver-status');
        const recvStats = document.getElementById('recv-stats');
        const progressBar = document.getElementById('recv-progress');
        
        let receivedData = new Map();
        let expectedChunks = 0;
        let receivingFileName = "";
        let isReceiving = false;

        document.getElementById('startRecvBtn').addEventListener('click', async () => {
            try {
                // Request higher resolution for better QR detection
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } } 
                });
                video.srcObject = stream;
                isReceiving = true;
                recvStatus.innerText = "Scanning for data stream...";
                recvStatus.style.color = "var(--primary)";
                
                // Wait for video to be ready before scanning
                video.addEventListener('loadedmetadata', () => {
                    scanCanvas.width = video.videoWidth;
                    scanCanvas.height = video.videoHeight;
                    requestAnimationFrame(scanVideo);
                });

            } catch (err) {
                recvStatus.innerText = "Camera Access Denied";
                recvStatus.style.color = "red";
            }
        });

        let lastScanTime = 0;
        
        function scanVideo(currentTime) {
            if (!isReceiving) return;

            // Throttle scanning to avoid locking up mobile browsers (e.g. max 30 times a second)
            if (currentTime - lastScanTime >= 30 && video.readyState === video.HAVE_ENOUGH_DATA) {
                lastScanTime = currentTime;
                
                ctx.drawImage(video, 0, 0, scanCanvas.width, scanCanvas.height);
                const imageData = ctx.getImageData(0, 0, scanCanvas.width, scanCanvas.height);
                
                // jsqr configuration optimized for speed
                const code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: "dontInvert" });

                if (code) processScannedData(code.data);
            }
            requestAnimationFrame(scanVideo);
        }

        function processScannedData(dataStr) {
            const splitIndex1 = dataStr.indexOf('|');
            const splitIndex2 = dataStr.indexOf('|', splitIndex1 + 1);
            const splitIndex3 = dataStr.indexOf('|', splitIndex2 + 1);
            
            if (splitIndex1 === -1 || splitIndex2 === -1 || splitIndex3 === -1) return;

            const fileName = dataStr.substring(0, splitIndex1);
            const index = parseInt(dataStr.substring(splitIndex1 + 1, splitIndex2));
            const total = parseInt(dataStr.substring(splitIndex2 + 1, splitIndex3));
            const chunkData = dataStr.substring(splitIndex3 + 1);

            if (!receivingFileName) {
                receivingFileName = fileName;
                expectedChunks = total;
                receivedData.clear();
            }

            if (!receivedData.has(index)) {
                receivedData.set(index, chunkData);
                updateProgress();
            }

            if (receivedData.size === expectedChunks && expectedChunks > 0) {
                assembleAndDownload();
            }
        }

        function updateProgress() {
            const percent = (receivedData.size / expectedChunks) * 100;
            progressBar.style.width = `${percent}%`;
            recvStats.innerText = `${receivedData.size} / ${expectedChunks} Chunks`;
            
            if(receivedData.size > 0 && recvStatus.innerText !== "Receiving Data...") {
                recvStatus.innerText = "Receiving Data...";
                recvStatus.style.color = "var(--success)";
            }
        }

        function assembleAndDownload() {
            isReceiving = false;
            recvStatus.innerText = "Transfer Complete! Reassembling...";
            
            let fullBase64 = "";
            for (let i = 0; i < expectedChunks; i++) {
                fullBase64 += receivedData.get(i);
            }

            // Trigger download via anchor tag
            const a = document.createElement('a');
            a.href = fullBase64;
            a.download = receivingFileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);

            recvStatus.innerText = "File successfully saved.";
            
            // Stop Camera
            const stream = video.srcObject;
            if(stream) stream.getTracks().forEach(track => track.stop());
            
            // Reset for next file
            setTimeout(() => {
                receivedData.clear();
                receivingFileName = "";
                expectedChunks = 0;
                progressBar.style.width = `0%`;
                recvStats.innerText = `0 / 0 Chunks`;
                recvStatus.innerText = "Camera Off";
                recvStatus.style.color = "var(--text)";
            }, 3000);
        }
    </script>
</body>
</html>
